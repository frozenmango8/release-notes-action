name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --exit-code -- dist

  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./
        id: notes
      - name: Check the outputs
        env:
          NOTES: ${{ steps.notes.outputs.notes }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          printf '%s\n' "$VERSION"
          printf '%s\n' "$NOTES"
          printf '%s\n' "$VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s\n' "$NOTES" | grep -q '## Features'
