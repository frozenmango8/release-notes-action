name: Example

on:
  workflow_dispatch:
    inputs:
      create-release:
        description: Open a draft release
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # In another repo, use frozenmango8/release-notes-action@v1.
      - uses: ./
        id: notes
        with:
          create-release: ${{ github.event_name == 'push' || inputs.create-release }}

      - env:
          NOTES: ${{ steps.notes.outputs.notes }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          printf '%s\n' "$VERSION"
          printf '%s\n' "$NOTES"
